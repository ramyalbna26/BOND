# Project-wide Gradle settings.
# Code On The Go — إعدادات مخصصة للبناء على جهاز ضعيف الذاكرة

# ============================================================
# ذاكرة Gradle daemon — زيادة الذاكرة لمنع فشل التغليف (Packaging)
# ============================================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ============================================================
# ذاكرة Kotlin daemon
# ============================================================
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.daemon.useFallbackStrategy=true

# ============================================================
# تعطيل الميزات الثقيلة على الأجهزة الضعيفة
# ============================================================
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.workers.max=1

# ============================================================
# AndroidX
# ============================================================
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# ============================================================
# ملاحظة: تم حذف السطرين دول لأنهم اتشالوا من AGP 8+:
#   android.useFullClasspathForDexingTransform=true
#   android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
# ============================================================