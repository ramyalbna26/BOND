# Project-wide Gradle settings.
# Code On The Go — إعدادات مخصصة للبناء على جهاز ضعيف الذاكرة (4GB RAM)

# ============================================================
# ذاكرة Gradle daemon — زيادة معقولة لمنع OOM في mergeExtDexDebug
# ============================================================
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ============================================================
# ذاكرة Kotlin daemon
# ============================================================
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.daemon.useFallbackStrategy=true

# ============================================================
# تعطيل الميزات الثقيلة على الأجهزة الضعيفة
# ============================================================
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.workers.max=1

# ============================================================
# تحسينات Dexing (الحل الأساسي لمشكلة OOM)
# ============================================================
# إجبار R8/D8 على العمل كعملية منفصلة بدل مشاركة ذاكرة الـ daemon
android.r8.maxWorkers=1
# الحل الجذري: إجبار D8 على استخدام مسار معالجة بديل وأقل استهلاكاً للذاكرة
android.useFullClasspathForDexingTransform=true

# ============================================================
# AndroidX
# ============================================================
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false