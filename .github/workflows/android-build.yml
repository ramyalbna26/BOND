name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Sanad-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Build Juzoor Release
      run: ./gradlew :juzoor:assembleRelease

    - name: Upload Juzoor APK
      uses: actions/upload-artifact@v4
      with:
        name: Juzoor-Release-APK
        path: juzoor/build/outputs/apk/release/juzoor-release.apk
